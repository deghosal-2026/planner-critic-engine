assertions:
  - path: "loki pod is running"
    check: "kubectl get pod -n monitoring -l app=loki -o jsonpath='{.items[0].status.phase}'"
    expected: "Running"
  - path: "promtail is shipping logs"
    check: "loki label names query returns namespace and pod labels"
    expected: "true"
  - path: "log parsing works"
    check: "loki query {namespace=\"staging\"} | json returns parsed fields"
    expected: "true"
  - path: "grafana datasource exists"
    check: "grafana datasource list includes loki"
    expected: "true"
  - path: "retention is 7 days"
    check: "loki config retention_period equals 168h"
    expected: "168h"