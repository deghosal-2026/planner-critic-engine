assertions:
  - path: "SLI metric is recorded"
    check: "prometheus query 'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))' returns a value"
    expected: "non-empty result"
  - path: "SLO target is defined"
    check: "slo-libson config specifies 99.9% monthly target for payments service"
    expected: "true"
  - path: "burn-rate alert rules exist"
    check: "prometheus rule groups contain SLOBurnRate5x and SLOBurnRate10x"
    expected: "true"
  - path: "error budget metric exists"
    check: "prometheus query 'slo:error_budget_burn:rate_5m' returns data"
    expected: "true"
  - path: "alert triggers on burn"
    check: "alertmanager receives SLOBurnRate firing when burn exceeds threshold"
    expected: "firing"