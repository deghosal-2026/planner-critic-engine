assertions:
  - path: "prometheus server pod is running"
    check: "kubectl get pod -n monitoring -l app=prometheus -o jsonpath='{.items[0].status.phase}'"
    expected: "Running"
  - path: "scrape targets are healthy"
    check: "prometheus_targets: all configured jobs have up==1"
    expected: "true"
  - path: "grafana dashboard exists"
    check: "kubectl get configmap -n monitoring grafana-dashboards -o name"
    expected: "configmap/grafana-dashboards"
  - path: "alerting rules are loaded"
    check: "prometheus rule groups contain high-cpu and high-error-rate rules"
    expected: "true"
  - path: "alert fires on high cpu"
    check: "prometheus alert HighCpuUsage is firing when cpu > 80% for 5m"
    expected: "firing"