assertions:
  - path: "k6 test ran successfully"
    check: "k6 run completed with 0 exit code"
    expected: "true"
  - path: "p99 latency under 500ms at target load"
    check: "prometheus query 'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"checkout\"}[5m]))' < 0.5"
    expected: "true"
  - path: "error rate below 0.1%"
    check: "prometheus query 'rate(http_requests_total{service=\"checkout\",status=~\"5..\"}[5m]) / rate(http_requests_total{service=\"checkout\"}[5m]) * 100 < 0.1"
    expected: "true"
  - path: "HPA limits were adjusted"
    check: "kubectl get hpa checkout -o jsonpath='{.spec.maxReplicas}' > previous value"
    expected: "true"
  - path: "re-test confirms SLOs"
    check: "post-adjustment k6 run shows p99 < 500ms at 500 RPS"
    expected: "true"