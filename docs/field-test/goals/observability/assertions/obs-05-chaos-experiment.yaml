assertions:
  - path: "chaos experiment was created"
    check: "kubectl get chaos -n staging inventory-pod-kill -o jsonpath='{.spec.action}'"
    expected: "pod-kill"
  - path: "pod was killed"
    check: "kubectl get events -n staging --field-selector reason=Killing -o json | jq '.items[0].message' contains 'inventory'"
    expected: "true"
  - path: "service recovered within 30s"
    check: "prometheus query 'time() - max(kube_pod_start_time{namespace=\"staging\", pod=~\"inventory.*\"}) by (pod)' <= 30"
    expected: "true"
  - path: "original replica count restored"
    check: "kubectl get deployment inventory -o jsonpath='{.spec.replicas}'"
    expected: "3"
  - path: "chaos rolled back"
    check: "kubectl get chaos -n staging inventory-pod-kill -o jsonpath='{.status.experiment.phase}'"
    expected: "Stopped"
  - path: "chaos report generated"
    check: "file exists: chaos-report-inventory-pod-kill.md"
    expected: "true"