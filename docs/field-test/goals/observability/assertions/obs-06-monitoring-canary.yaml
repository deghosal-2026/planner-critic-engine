assertions:
  - path: "canary pod is running"
    check: "kubectl get pod -n monitoring -l app=canary-api-gateway -o jsonpath='{.items[0].status.phase}'"
    expected: "Running"
  - path: "canary metrics are exposed"
    check: "prometheus query 'canary_http_request_duration_seconds_count' returns data"
    expected: "non-empty result"
  - path: "canary dashboard exists"
    check: "grafana dashboard search returns 'API Gateway Canary Health'"
    expected: "true"
  - path: "5xx alert rule exists"
    check: "prometheus rule groups contain CanaryHighErrorRate"
    expected: "true"
  - path: "alert fires on 5xx > 1%"
    check: "inject 2% 5xx rate via canary endpoint, prometheus alert CanaryHighErrorRate transitions to firing within 5m"
    expected: "firing"