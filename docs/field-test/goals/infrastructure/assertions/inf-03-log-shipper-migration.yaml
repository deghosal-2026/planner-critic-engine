id: inf-03-log-shipper-migration
title: Log Shipper Migration assertions
description: Assertions for dual-ship compare-and-cutover with balanced risk tolerance

assertions:
  - stage: plan
    check: "baseline documents Fluentd config and resource usage"
    expected: true
    severity: critical
  - stage: plan
    check: "FluentBit config matches Fluentd pipeline exactly"
    expected: true
    severity: critical
  - stage: execute
    check: "dual-ship deploys both agents on 10% canary nodes"
    expected: true
    severity: critical
  - stage: execute
    check: "canary duration is at least 24 hours"
    expected: true
    severity: high
  - stage: verify
    check: "log volume delta between agents is < 1%"
    expected: true
    severity: critical
  - stage: verify
    check: "CPU overhead increase is < 10% per node"
    expected: true
    severity: high
  - stage: verify
    check: "memory reduction is >= 30% per node"
    expected: true
    severity: medium
  - stage: execute
    check: "rollout progresses in waves of 50 nodes max"
    expected: true
    severity: medium
  - stage: policy
    check: "replan_policy patch allows skipping completed waves"
    expected: true
    severity: high
  - stage: risk
    check: "balanced tolerance does not mandate a rollback plan"
    expected: false
    severity: medium