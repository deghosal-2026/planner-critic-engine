id: inf-07-dns-migration
title: Cross-Region DNS Migration assertions
description: Assertions for strict dns migration with TTL management, failover verification, and rollback

assertions:
  - stage: plan
    check: "eu-west-1 infrastructure is fully provisioned before DNS changes"
    expected: true
    severity: critical
  - stage: plan
    check: "health checks for both regions are configured and passing"
    expected: true
    severity: critical
  - stage: execute
    check: "TTL is lowered from 300s to 60s before record update"
    expected: true
    severity: critical
  - stage: execute
    check: "propagation wait period respects the new TTL"
    expected: true
    severity: high
  - stage: execute
    check: "eu-west-1 set as primary, us-east-1 as failover"
    expected: true
    severity: critical
  - stage: verify
    check: "DNS resolution returns eu-west-1 from 3+ geographic regions"
    expected: true
    severity: critical
  - stage: verify
    check: "failover test completes within 2x TTL window (120s)"
    expected: true
    severity: critical
  - stage: verify
    check: "zero 5xx errors during and after migration"
    expected: true
    severity: critical
  - stage: rollback
    check: "rollback restores us-east-1 as primary and reverts TTL"
    expected: true
    severity: critical
  - stage: risk
    check: "strict tolerance mandates both verify and rollback steps"
    expected: true
    severity: critical