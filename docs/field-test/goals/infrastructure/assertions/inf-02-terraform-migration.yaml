id: inf-02-terraform-migration
title: Terraform State Migration assertions
description: Assertions for state migration with plan-first and patch-on-failure

assertions:
  - stage: plan
    check: "terraform plan is executed before any state mutation"
    expected: true
    severity: critical
  - stage: plan
    check: "plan confirms 0 resources to change (state-only)"
    expected: true
    severity: critical
  - stage: execute
    check: "terraform init -migrate-state is run with -auto-approve"
    expected: true
    severity: critical
  - stage: verify
    check: "S3 state file exists and checksum matches local backup"
    expected: true
    severity: critical
  - stage: verify
    check: "DynamoDB lock table is operational"
    expected: true
    severity: high
  - stage: verify
    check: "terraform plan post-migration shows 0 drift"
    expected: true
    severity: critical
  - stage: rollback
    check: "terraform state push from backup restores original state"
    expected: true
    severity: critical
  - stage: rollback
    check: "reversion of backend config reconnects to local backend"
    expected: true
    severity: critical
  - stage: policy
    check: "replan_policy patch allows resuming from failed step"
    expected: true
    severity: high
  - stage: risk
    check: "strict tolerance requires backup before any mutation"
    expected: true
    severity: critical