id: inf-01-ecs-migration
title: EC2 to ECS Fargate Migration assertions
description: Smoke-test assertions that verify the planner/critic correctly handles a strict migration with restart-on-failure

assertions:
  - stage: plan
    check: "discover step produces complete instance inventory"
    expected: true
    severity: critical
  - stage: plan
    check: "provision step validates TF plan before apply"
    expected: true
    severity: critical
  - stage: execute
    check: "drain completes all active connections before cutover"
    expected: true
    severity: critical
  - stage: execute
    check: "cutover shifts 100% traffic atomically"
    expected: true
    severity: critical
  - stage: verify
    check: "smoke tests pass for all 20 workloads"
    expected: true
    severity: critical
  - stage: verify
    check: "latency p99 increase is below 5% threshold"
    expected: true
    severity: high
  - stage: rollback
    check: "rollback re-registers EC2 targets within SLA"
    expected: true
    severity: critical
  - stage: policy
    check: "replan_policy restart causes full re-execution on failure"
    expected: true
    severity: high
  - stage: risk
    check: "strict risk_tolerance requires rollback plan definition"
    expected: true
    severity: critical