id: inf-04-workload-identity
title: Workload Identity Migration assertions
description: Assertions for service account migration with strict tolerance and restart policy

assertions:
  - stage: plan
    check: "audit step identifies all workloads using static keys"
    expected: true
    severity: critical
  - stage: plan
    check: "new SA has equivalent IAM roles mapped"
    expected: true
    severity: critical
  - stage: execute
    check: "kubernetes SA is annotated with iam.gke.io binding"
    expected: true
    severity: critical
  - stage: execute
    check: "rolling restart applies to all annotated deployments"
    expected: true
    severity: critical
  - stage: verify
    check: "all pods authenticate via metadata server (not static keys)"
    expected: true
    severity: critical
  - stage: verify
    check: "integration tests pass for all migrated workloads"
    expected: true
    severity: critical
  - stage: execute
    check: "static keys are deleted from Secret Manager and IAM"
    expected: true
    severity: high
  - stage: rollback
    check: "rollback recreates static keys and restores secrets"
    expected: true
    severity: critical
  - stage: policy
    check: "replan_policy restart triggers full re-execution"
    expected: true
    severity: high
  - stage: risk
    check: "strict tolerance mandates both verify and rollback steps"
    expected: true
    severity: critical