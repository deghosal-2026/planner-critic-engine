id: inf-05-rate-limiting
title: API Gateway Rate Limiting assertions
description: Assertions for rate limit definition, deployment, testing, and tuning

assertions:
  - stage: plan
    check: "traffic analysis identifies peak TPS and client distribution"
    expected: true
    severity: high
  - stage: plan
    check: "rate limits defined per route and per client tier"
    expected: true
    severity: critical
  - stage: execute
    check: "canary stage deployed before production"
    expected: true
    severity: high
  - stage: execute
    check: "throttled clients receive 429 responses"
    expected: true
    severity: critical
  - stage: verify
    check: "legitimate traffic success rate > 99.9%"
    expected: true
    severity: critical
  - stage: verify
    check: "false positive 429 rate < 0.1%"
    expected: true
    severity: high
  - stage: execute
    check: "load test covers 80%, 100%, and 120% of limits"
    expected: true
    severity: medium
  - stage: verify
    check: "p99 latency shows no regression under normal load"
    expected: true
    severity: high
  - stage: policy
    check: "replan_policy patch allows tuning without full restart"
    expected: true
    severity: medium
  - stage: risk
    check: "balanced tolerance does not mandate a rollback step"
    expected: false
    severity: medium