id: inf-06-cost-optimization
title: AWS Cost Optimization assertions
description: Assertions for idle resource identification, resizing, verification, and iteration

assertions:
  - stage: plan
    check: "idle resource discovery queries last 14 days of metrics"
    expected: true
    severity: critical
  - stage: plan
    check: "candidates are tagged with estimated savings before action"
    expected: true
    severity: medium
  - stage: plan
    check: "resources classified into stop/resize/approval tiers"
    expected: true
    severity: high
  - stage: execute
    check: "safe-to-stop instances are stopped, not terminated"
    expected: true
    severity: critical
  - stage: execute
    check: "safe-to-resize instances use rolling replacement"
    expected: true
    severity: high
  - stage: verify
    check: "7-day monitoring period for stopped instances"
    expected: true
    severity: high
  - stage: verify
    check: "post-resize CPU utilization is in 40-70% range"
    expected: true
    severity: medium
  - stage: verify
    check: "application error rate shows no regression"
    expected: true
    severity: critical
  - stage: verify
    check: "savings report shows >= 15% cost reduction"
    expected: true
    severity: high
  - stage: policy
    check: "replan_policy patch allows skipping completed cycles"
    expected: true
    severity: medium