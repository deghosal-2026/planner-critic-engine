goal_id: arch-03-kafka-rebalance
checks:
  - id: isr-health
    description: All partition replicas have ISR count equal to replication factor
    type: metric
    metric: min_isr_count
    operator: eq
    value: 3
    unit: count
  - id: consumer-lag
    description: Consumer lag for all groups is under 30 seconds
    type: metric
    metric: max_consumer_lag
    operator: lte
    value: 30
    unit: seconds
  - id: producer-throughput
    description: Producer throughput stays within 5% of pre-rebalance baseline
    type: metric
    metric: producer_throughput
    operator: within_pct
    value: 5
    baseline: pre_rebalance
  - id: broker-count
    description: Cluster reports 6 brokers in active state
    type: configuration
    resource: kafka_brokers
    check: 'length(@.brokers) == 6 && all(@.brokers, &.state == "RUNNING")'
  - id: partition-distribution
    description: Partitions are evenly distributed across all 6 brokers
    type: metric
    metric: partition_distribution_stddev
    operator: lte
    value: 1
    unit: partitions