goal_id: arch-05-schema-evolution
checks:
  - id: backward-compatibility
    description: All existing consumers consume v2 events without deserialization errors
    type: metric
    metric: deserialization_error_rate
    operator: eq
    value: 0
    unit: errors_per_hour
  - id: forward-compatibility
    description: New consumers can read legacy v1 topics without error
    type: metric
    metric: v1_topic_deserialization_error_rate
    operator: eq
    value: 0
    unit: errors_per_hour
  - id: schema-registered
    description: v2 schema is registered with BACKWARD compatibility mode
    type: configuration
    resource: schema_registry_subject
    check: 'subject.compatibilityLevel == "BACKWARD" && subject.schema_version == 2'
  - id: producer-migration
    description: All producers are writing v2 schema
    type: metric
    metric: v2_schema_write_ratio
    operator: eq
    value: 100
    unit: percent
  - id: v1-deprecation
    description: v1 schema is marked as deprecated in Schema Registry
    type: configuration
    resource: schema_registry_subject
    check: 'subject.versions[?version==1].state == "DEPRECATED"'