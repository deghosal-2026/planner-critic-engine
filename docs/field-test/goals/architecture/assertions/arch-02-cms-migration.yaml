goal_id: arch-02-cms-migration
checks:
  - id: content-integrity
    description: All migrated content passes checksum verification
    type: metric
    metric: content_checksum_match_rate
    operator: eq
    value: 100
    unit: percent
  - id: seo-preservation
    description: Critical URL paths return 200, not 404
    type: http
    method: GET
    paths:
      - /blog
      - /about
      - /contact
      - /privacy-policy
    expected_status: 200
  - id: redirect-correctness
    description: Old WordPress URLs 301-redirect to new CMS paths
    type: http
    method: GET
    follow_redirects: false
    path_samples:
      - from: /?p=123
        expected_status: 301
        expected_location_contains: /contentful/
  - id: wp-infra-terminated
    description: WordPress infrastructure is decommissioned
    type: configuration
    resource: wp_ec2
    check: 'state == "terminated"'
  - id: search-rank-baseline
    description: Organic search rankings remain within 10% of pre-migration baseline
    type: metric
    metric: avg_search_position
    operator: lte
    value: 1.1
    unit: multiple_of_baseline