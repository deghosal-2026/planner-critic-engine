id: data-05-warehouse-model-assertions
goal: data-05-warehouse-model
assertions:
  - description: "Star schema fact table row count matches source"
    check: "fact_row_count == source_row_count"
    severity: critical
  - description: "SCD type-2 dimensions have no overlapping effective ranges"
    check: "overlapping_ranges.count == 0"
    severity: high
  - description: "Historical backfill completes without gaps"
    check: "date_spine_coverage == 1.0"
    severity: critical
  - description: "All foreign key relationships are satisfied"
    check: "orphaned_fact_rows == 0"
    severity: critical
  - description: "Rollback restores prior schema within 5 minutes"
    check: "rollback_duration_seconds <= 300"
    severity: critical