id: data-02-ml-deploy-assertions
goal: data-02-ml-deploy
assertions:
  - description: "Training completes without data leakage"
    check: "train_val_score_diff <= 0.05"
    severity: critical
  - description: "Validation metrics meet minimum threshold"
    check: "val_accuracy >= min_acceptable_accuracy"
    severity: critical
  - description: "Model package is reproducible from pinned dependencies"
    check: "pkg_hash == expected_hash"
    severity: high
  - description: "A/B test shows statistical significance"
    check: "p_value <= 0.05"
    severity: high
  - description: "Rollback mechanism restores previous model within 60s"
    check: "rollback_duration <= 60"
    severity: critical