id: data-04-streaming-pipeline-assertions
goal: data-04-streaming-pipeline
assertions:
  - description: "Kafka producer throughput meets minimum rate"
    check: "producer_throughput >= min_throughput_mbps"
    severity: critical
  - description: "Flink checkpointing completes with zero failures"
    check: "checkpoint_failures == 0"
    severity: critical
  - description: "End-to-end latency stays below threshold"
    check: "p99_latency_ms <= max_latency_ms"
    severity: high
  - description: "S3 sink writes match Kafka record count"
    check: "s3_record_count == kafka_record_count"
    severity: critical
  - description: "Rollback restores prior consumer offset within checkpoint interval"
    check: "rollback_offset_lag <= max_offset_lag"
    severity: critical