id: data-01-dbt-pipeline-assertions
goal: data-01-dbt-pipeline
assertions:
  - description: "Pipeline extracts all expected S3 source files"
    check: "source_row_count == expected_row_count"
    severity: critical
  - description: "Staging models compile without errors"
    check: "dbt_run_staging.exit_code == 0"
    severity: critical
  - description: "Transform models produce expected schema"
    check: "schema_diff.count == 0"
    severity: high
  - description: "Load completes within SLA window"
    check: "pipeline_duration <= sla_seconds"
    severity: high
  - description: "Verification step confirms row parity"
    check: "target_row_count == source_row_count"
    severity: critical