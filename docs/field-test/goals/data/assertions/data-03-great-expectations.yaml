id: data-03-great-expectations-assertions
goal: data-03-great-expectations
assertions:
  - description: "All defined expectations compile successfully"
    check: "ge_suite_validation.passed == true"
    severity: critical
  - description: "Run completes within batch window"
    check: "check_run_duration <= batch_window_seconds"
    severity: high
  - description: "Failure alerts reach Slack channel"
    check: "alert_delivery.confirmed == true"
    severity: high
  - description: "No unexpected columns in any tracked dataset"
    check: "unexpected_columns.count == 0"
    severity: critical