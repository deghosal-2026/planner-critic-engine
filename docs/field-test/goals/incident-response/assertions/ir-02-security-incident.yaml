id: ir-02-security-incident
goal_ref: ir-02-security-incident.json
assertions:
  - step: "Isolate instance"
    expected: true
    check: "plan revokes security group ingress rules before any other remediation"
  - step: "Rotate IAM keys"
    expected: true
    check: "aws iam create-access-key followed by aws iam delete-access-key on old key"
  - step: "Forensic snapshot"
    expected: true
    check: "aws ec2 create-snapshot on all volumes attached to the instance"
  - step: "Verify containment"
    expected: true
    check: "post-remediation CloudTrail lookup shows no further anomalous DescribeInstances calls"
  - step: "Ordering: contain before investigate"
    expected: true
    check: "containment (SG revoke) precedes forensic snapshot"
  - step: "No key reuse"
    expected: false
    check: "plan reuses the compromised key for any purpose after rotation"