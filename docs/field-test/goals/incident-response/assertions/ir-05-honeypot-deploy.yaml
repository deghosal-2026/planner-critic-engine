id: ir-05-honeypot-deploy
goal_ref: ir-05-honeypot-deploy.json
assertions:
  - step: "Fake AWS key token"
    expected: true
    check: "plan creates a Canarytoken of type 'aws-key' and records its URL"
  - step: "Fake DB connection string token"
    expected: true
    check: "plan creates a Canarytoken of type 'sql-string' or custom and records its URL"
  - step: "Fake API key token"
    expected: true
    check: "plan creates a Canarytoken of type 'api-key' and records its URL"
  - step: "Alerting configured"
    expected: true
    check: "each token has a PagerDuty webhook in its alert config"
  - step: "Playbook written"
    expected: true
    check: "plan includes a triage → contain → investigate response playbook"
  - step: "Tokens deployed to correct locations"
    expected: true
    check: "fake AWS key goes to a repo (git), DB string to CI env, API key to config file"
  - step: "Functional test"
    expected: true
    check: "plan includes a curl to each token's trigger URL to verify alert delivery"