id: ir-03-tls-rotation
goal_ref: ir-03-tls-rotation.json
assertions:
  - step: "Generate cert via ACM"
    expected: true
    check: "plan requests a certificate from ACM before modifying listeners"
  - step: "Rotate all 20 ALBs"
    expected: true
    check: "each of the 20 ALBs has an elbv2 modify-listener action with new cert ARN"
  - step: "Verify HTTPS on every ALB"
    expected: true
    check: "curl or openssl s_client checks each ALB endpoint and validates cert serial"
  - step: "Rollback plan"
    expected: true
    check: "rollback re-associates the original cert on any failed ALB"
  - step: "Expiry check"
    expected: true
    check: "plan verifies new cert expiry is > 48 hours from now"
  - step: "Batch safety"
    expected: true
    check: "plan does not rotate more than 5 ALBs concurrently (rate limiting)"