id: ir-04-vault-rotation
goal_ref: ir-04-vault-rotation.json
assertions:
  - step: "Generate new password in Vault"
    expected: true
    check: "vault write on the dynamic secrets engine path before any consumer update"
  - step: "Update all consumers"
    expected: true
    check: "plan triggers a reload or restart for each service using the DB credential"
  - step: "Verify SELECT works"
    expected: true
    check: "plan executes a test query against the DB with the new credential"
  - step: "Revoke old lease"
    expected: true
    check: "vault lease revoke on the old secret after successful verification"
  - step: "Rollback plan"
    expected: true
    check: "rollback re-issues the old lease and reverts consumer config"
  - step: "No secret in logs"
    expected: true
    check: "plan avoids echoing or logging the actual secret value"