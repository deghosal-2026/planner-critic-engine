id: ir-06-cis-remediation
goal_ref: ir-06-cis-remediation.json
assertions:
  - step: "Run kube-bench scan"
    expected: true
    check: "plan runs kube-bench against the EKS cluster before any remediation"
  - step: "Categorize findings"
    expected: true
    check: "plan separates findings into HIGH/MEDIUM/LOW severity buckets"
  - step: "Remediate all HIGH findings"
    expected: true
    check: "every CIS HIGH finding has a corresponding kubectl or aws-cli remediation action"
  - step: "Enable audit logging"
    expected: true
    check: "plan enables EKS control plane audit logging if missing (CIS 1.2.x)"
  - step: "Set pod security standards"
    expected: true
    check: "plan applies a PodSecurityStandard (restricted/baseline) if missing"
  - step: "Restrict RBAC"
    expected: true
    check: "plan removes cluster-admin bindings for non-admin users if present"
  - step: "Re-scan"
    expected: true
    check: "plan runs kube-bench a second time after remediation"
  - step: "Generate report"
    expected: true
    check: "plan generates a before/after PDF or structured report"
  - step: "No MEDIUM/LOW downgraded"
    expected: false
    check: "plan skips or ignores MEDIUM/LOW findings entirely"