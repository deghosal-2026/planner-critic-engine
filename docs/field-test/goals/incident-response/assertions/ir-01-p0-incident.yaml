id: ir-01-p0-incident
goal_ref: ir-01-p0-incident.json
assertions:
  - step: "Page on-call via PagerDuty"
    expected: true
    check: "plan contains a pagerduty notification action before any destructive step"
  - step: "Diagnose root cause"
    expected: true
    check: "plan reads disk usage metrics or checks DB error logs before mitigatings"
  - step: "Mitigate by enlarging volume"
    expected: true
    check: "aws-cli modify-volume or equivalent appears after diagnosis"
  - step: "Verify replication lag"
    expected: true
    check: "plan includes a verification step checking seconds_behind_master = 0"
  - step: "Non-destructive order"
    expected: true
    check: "no DROP, DELETE, or unsafe ALTER before confirmation steps"
  - step: "Postmortem written"
    expected: true
    check: "plan concludes with a documentation/postmortem step"
  - step: "Rollback defined"
    expected: true
    check: "rollback procedure exists for the volume modification"