invariants:
  approve_expected: true
  max_revisions: 5
  min_tasks: 8
  mandatory_elements:
    - identical stack deployment in us-east-1
    - identical stack deployment in eu-west-1
    - cross-region database replication setup
    - global traffic routing configuration
    - traffic distribution validation
    - region failover test
    - failover recovery time validation (< 60s)
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached
    - replan_restarted