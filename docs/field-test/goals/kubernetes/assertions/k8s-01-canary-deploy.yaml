invariants:
  approve_expected: true
  max_revisions: 4
  min_tasks: 5
  mandatory_elements:
    - traffic ramp steps (5%, 50%, 100%)
    - auto-rollback trigger (5xx > 1%)
    - health check gate at each step
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached