invariants:
  approve_expected: true
  max_revisions: 4
  min_tasks: 6
  mandatory_elements:
    - green stack provisioning
    - smoke tests against green
    - DNS/ingress switch to green
    - monitoring window after switch
    - blue stack decommission
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached
    - replan_restarted