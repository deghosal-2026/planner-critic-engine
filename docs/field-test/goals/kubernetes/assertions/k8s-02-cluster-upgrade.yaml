invariants:
  approve_expected: true
  max_revisions: 4
  min_tasks: 6
  mandatory_elements:
    - node drain procedure
    - etcd backup
    - control plane upgrade sequence
    - worker node upgrade
    - verification after upgrade
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached
    - replan_restarted