invariants:
  approve_expected: true
  max_revisions: 4
  min_tasks: 6
  mandatory_elements:
    - sidecar injection via namespace label
    - traffic routing at 1%, 50%, 100%
    - observation window at each ramp step
    - latency and error rate monitoring
    - legacy deployment decommission
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached