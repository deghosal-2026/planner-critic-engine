invariants:
  approve_expected: false
  max_revisions: 4
  min_tasks: 6
  mandatory_elements:
  - image pull from Docker Hub
  - image retag to ECR URI
  - image push to ECR
  - manifest update for all services
  - rolling restart
  - verification after migration
  mandatory_task_attributes:
    high_risk:
    - has_verification: true
    - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
  - revision_cap_reached
  - replan_restarted
