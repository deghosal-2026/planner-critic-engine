invariants:
  approve_expected: true
  max_revisions: 5
  min_tasks: 5
  mandatory_elements:
    - backup
    - verification
    - monitoring
    - rollback
  mandatory_task_attributes:
    high_risk:
      - has_verification: true
      - has_rollback: true
  forbidden_blockers: []
  acceptable_escalation_reasons:
    - revision_cap_reached
    - replan_restarted