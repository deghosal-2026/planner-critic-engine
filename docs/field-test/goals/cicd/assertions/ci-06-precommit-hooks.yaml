assertions:
  - action: create-template-repo
    must_execute: true
    postcondition: "Shared .pre-commit-config.yaml published to template repo with all 6 hooks configured"
    failure_action: "Fix config; verify hook versions exist on PyPI"

  - action: batch-1-install
    must_execute: true
    postcondition: "First 10 repos have .pre-commit-config.yaml committed; 'pre-commit install' runs in CI"
    failure_action: "Check git permissions; verify pre-commit CI action syntax"

  - action: batch-1-enforce
    must_execute: true
    depends_on: ["batch-1-install"]
    postcondition: "PRs on batch-1 repos blocked if hooks fail; existing PRs grandfathered"
    failure_action: "Adjust CI workflow; add bypass label support"

  - action: batch-2-through-5
    must_execute: false
    postcondition: "Remaining 40 repos have hooks installed and enforced in CI"
    failure_action: "Roll back batch; fix template before next batch"

  - action: verify-compliance
    must_execute: true
    depends_on: ["batch-2-through-5"]
    postcondition: "All 50 repos pass hooks on 'pre-commit run --all-files'; zero secrets detected in history"
    failure_action: "Generate compliance report; tag non-compliant teams"

  - action: report
    must_execute: false
    final: true
    postcondition: "Dashboard shows 50/50 repos green; hook pass rate > 95% over 7 days"
    failure_action: "Notify platform team; schedule remediation"