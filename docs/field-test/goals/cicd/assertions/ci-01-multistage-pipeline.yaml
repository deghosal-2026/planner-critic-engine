assertions:
  - stage: lint
    must_execute: true
    postcondition: "All lint checks pass with zero errors"
    failure_action: "Halt pipeline; notify team"

  - stage: test
    must_execute: true
    depends_on: ["lint-pass"]
    postcondition: "All unit and integration tests pass (>= 80% coverage)"
    failure_action: "Halt pipeline; report test failures"

  - stage: build
    must_execute: true
    depends_on: ["test-pass"]
    postcondition: "Docker image built and tagged with commit SHA"
    failure_action: "Halt pipeline; log build error"

  - stage: staging
    must_execute: true
    depends_on: ["build-pass"]
    postcondition: "Container deployed to staging namespace; health endpoint returns 200"
    failure_action: "Halt pipeline; rollback staging"

  - stage: integration
    must_execute: true
    depends_on: ["staging-deploy"]
    postcondition: "All integration tests against staging pass"
    failure_action: "Halt pipeline; rollback staging"

  - stage: prod-promote
    must_execute: true
    depends_on: ["integration-pass", "approval-gate"]
    postcondition: "Canary deployed to production; monitored for 10 minutes"
    failure_action: "Rollback production; notify on-call"