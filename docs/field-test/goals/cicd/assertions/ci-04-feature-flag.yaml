assertions:
  - phase: add-flag
    must_execute: true
    postcondition: "Feature flag toggle wrapped around new code; default state is OFF; unit tests cover both branches"
    failure_action: "Block PR; require flag wrapper"

  - phase: deploy-off
    must_execute: true
    depends_on: ["add-flag"]
    postcondition: "Deployed to production with flag OFF; existing behavior unchanged"
    failure_action: "Rollback deployment"

  - phase: staging-test
    must_execute: true
    depends_on: ["deploy-off"]
    postcondition: "Flag enabled in staging; QA confirms feature works; all integration tests pass"
    failure_action: "Disable flag in staging; file bug"

  - phase: beta-enable
    must_execute: true
    depends_on: ["qa-approval"]
    postcondition: "Flag enabled for beta cohort (internal users); monitored for 24 hours"
    failure_action: "Disable flag; rollback to OFF"

  - phase: full-rollout
    must_execute: true
    depends_on: ["product-approval", "beta-enable"]
    postcondition: "Flag enabled for 100% of users; metrics stable for 48 hours"
    failure_action: "Disable flag; revert to beta cohort"

  - phase: flag-cleanup
    must_execute: true
    depends_on: ["full-rollout"]
    postcondition: "Flag removed from codebase; dead code eliminated; cleanup PR merged"
    failure_action: "Create follow-up ticket; tag tech-debt board"