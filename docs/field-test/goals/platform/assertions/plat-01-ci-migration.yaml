id: plat-01-ci-migration
goal_id: plat-01-ci-migration
phase: post-execution
category: functional
severity: critical
description: >
  Every migrated repo must have a valid GitHub Actions workflow that
  produces the same CI outcomes as the original Travis CI pipeline.
check:
  - type: file_exists
    path: ".github/workflows/ci.yml"
    count: 1
    per_repo: true
  - type: command_output
    command: "gh run list --repo {repo} --workflow ci.yml --limit 1 --json conclusion --jq '.[0].conclusion'"
    expected: "success"
    per_repo: true
  - type: no_such_file
    path: ".travis.yml"
    count: 0
    per_repo: true
  - type: command_output
    command: "gh api repos/{org}/{repo}/hooks --jq 'length'"
    expected: "0"
    per_repo: true
    description: "No Travis CI webhooks remain active"