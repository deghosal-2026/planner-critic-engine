[project]
name = "planner-critic"
version = "0.1.0"
description = "Hierarchical task planning with an independent LLM critic. A planner decomposes a goal into a typed plan; a critic audits every subtask; the plan is revised until approval — or escalated to a human."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deghosal-2026" }]
keywords = [
    "agent",
    "planning",
    "critique",
    "llm",
    "ai",
    "governance",
    "escalation",
    "safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.scripts]
plancritic = "planner_critic._cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "PyYAML>=6.0",
    "types-PyYAML>=6.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner_critic"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".coverage",
    "dist",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "S607", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=planner_critic --cov-fail-under=93"

[tool.coverage.run]
branch = true
source = ["planner_critic"]
omit = [
    "src/planner_critic/_cli.py",
    "src/planner_critic/field_test_harness.py",
    "src/planner_critic/llm/logging_provider.py",
    "src/planner_critic/server/mcp_http_run.py",
    "src/planner_critic/cli/field_test.py",
    "src/planner_critic/server/http_serve.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "planner_critic.field_test_harness",
    "planner_critic.cli.field_test",
    "planner_critic.llm.logging_provider",
    "planner_critic.server.mcp_http_run",
]
ignore_errors = true