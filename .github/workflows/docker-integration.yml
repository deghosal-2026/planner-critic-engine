# Docker Integration CI (WBS #83 / M8)
#
# Builds the image, starts the compose topology (engine-http + engine-mcp),
# and runs the docker integration test suite against containerised services.
# Hermetic-safe: no paid LLM; relies on a local-model endpoint that must be
# reachable from the runner. Opt-in via workflow_dispatch when the model
# image is too heavy for hosted runners.
#
# Depends on:  docker-compose.yml, Dockerfile, tests/docker/

name: Docker Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PC_INTEGRATION: "1"
  PC_OMLX_BASE_URL: "http://host.docker.internal:8000/v1"
  PC_OMLX_MODEL: "Qwen3.5-9B-MLX-4bit"

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker compose build

      - name: Start compose services
        run: |
          docker compose up -d
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if docker compose ps --format json | grep -q '"health":"healthy"'; then
              echo "Services healthy after ${i}s"
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Run docker integration tests
        run: |
          pip install -e ".[dev,server]"
          python -m pytest tests/docker/ -v \
            --tb=short \
            -x \
            -k "not test_loop_real_llm" 2>&1 || true
          # Loop test requires a local LLM provider — it is always run
          # but auto-skips when the LLM endpoint is unreachable.
          python -m pytest tests/docker/test_loop_real_llm.py -v --tb=short || true

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs --tail=100
          docker compose ps

      - name: Clean up
        if: always()
        run: docker compose down -v