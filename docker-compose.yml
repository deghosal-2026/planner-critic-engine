services:
  engine-http:
    build: .
    image: planner-critic-engine:test
    entrypoint: ["python3", "-m", "planner_critic.server.http_serve"]
    ports:
      - "8080:8080"
    environment:
      PC_OPENAI_BASE_URL: "${PC_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      PC_OPENAI_MODEL: "${PC_OPENAI_MODEL:-openai/gpt-4o-mini}"
      PC_OPENAI_API_KEY: "${PC_OPENAI_API_KEY:-}"
      PC_REVISION_CAP: "${PC_REVISION_CAP:-3}"
      PC_CRITIQUE_MODE: "${PC_CRITIQUE_MODE:-deterministic-first}"
      PC_MAX_TOKENS: "${PC_MAX_TOKENS:-16384}"
      PC_STORE: "/data/plans.db"
      PC_CONFIG: "/data/plancritic.toml"
      PC_PORT: "8080"
      PC_LOG_LEVEL: "${PC_LOG_LEVEL:-INFO}"
    volumes:
      - engine-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  engine-mcp:
    build: .
    image: planner-critic-engine:test
    entrypoint: ["python3", "-m", "planner_critic.server.mcp_http_run"]
    ports:
      - "9090:9090"
    environment:
      PC_OPENAI_BASE_URL: "${PC_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      PC_OPENAI_MODEL: "${PC_OPENAI_MODEL:-openai/gpt-4o-mini}"
      PC_OPENAI_API_KEY: "${PC_OPENAI_API_KEY:-}"
      PC_REVISION_CAP: "${PC_REVISION_CAP:-3}"
      PC_CRITIQUE_MODE: "${PC_CRITIQUE_MODE:-deterministic-first}"
      PC_MAX_TOKENS: "${PC_MAX_TOKENS:-16384}"
      PC_STORE: "/data/plans.db"
      PC_CONFIG: "/data/plancritic.toml"
      PC_HOST: "0.0.0.0"
      PC_PORT: "9090"
      PC_LOG_LEVEL: "${PC_LOG_LEVEL:-INFO}"
    volumes:
      - engine-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9090/healthz',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  engine-data: