# Asymmetric: strong planner (gpt-4o) + light critic (gpt-4o-mini)
[roles]
planner = "strong"
critic = "light"

[providers.strong]
transport = "openai-compatible"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 16384
timeout_s = 300.0

[providers.light]
transport = "openai-compatible"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 16384
timeout_s = 300.0