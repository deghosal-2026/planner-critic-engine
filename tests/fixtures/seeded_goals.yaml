# Seeded goals for critique acceptance tests (F-04, M3 success metric).
#
# Each seeded goal contains a deliberate planning flaw in one heuristic
# family. The acceptance test drives the LLMCritic with a fake provider that
# returns the "correct" structured finding, and asserts the flaw is surfaced
# with the right family + reason code + severity. Target: 100% of seeded
# flaws surfaced (≥90% required).

seeded_goals:
  - id: seeded_feasibility
    family: feasibility
    severity: blocker
    reason_code: llm_feasibility
    description: >
      Migrate the billing service. Step 2 relies on a PostgreSQL tool that is
      NOT present in the execution environment.

  - id: seeded_risk
    family: risk
    severity: warning
    reason_code: llm_risk
    description: >
      Roll out the auth service to 100% of prod with no canary and no
      rollback window, deleting the previous key material.

  - id: seeded_missing_steps
    family: missing_steps
    severity: warning
    reason_code: llm_missing_steps
    description: >
      Cut over the database migration but there is no step to back up the
      existing schema or verify compatibility before the cutover.

  - id: seeded_unsafe_sequencing
    family: unsafe_sequencing
    severity: blocker
    reason_code: llm_unsafe_sequencing
    description: >
      Deploy the new version, then run the schema migration that the deploy
      already depends on, in the same parallel group.

  - id: seeded_unverified_dependencies
    family: unverified_dependencies
    severity: warning
    reason_code: llm_unverified_dependencies
    description: >
      Execute step 5 which assumes the maintenance window is booked, but no
      earlier step books it and no probe verifies it.

  - id: seeded_weak_rollback
    family: weak_rollback
    severity: blocker
    reason_code: llm_weak_rollback
    description: >
      Make an irreversible production data write with no rollback step and no
      safety gate before it.

# The expected structured finding a correct critic returns for each seeded
# goal, keyed by goal id.
expected_findings:
  seeded_feasibility:
    heuristic_family: feasibility
    severity: blocker
    task_id: t1
    message: step relies on a tool not in the environment
  seeded_risk:
    heuristic_family: risk
    severity: warning
    task_id: t1
    message: irreversible change with no canary
  seeded_missing_steps:
    heuristic_family: missing_steps
    severity: warning
    task_id: t1
    message: no compatibility check before cutover
  seeded_unsafe_sequencing:
    heuristic_family: unsafe_sequencing
    severity: blocker
    task_id: t1
    message: migration runs after its dependent deploy
  seeded_unverified_dependencies:
    heuristic_family: unverified_dependencies
    severity: warning
    task_id: t1
    message: assumes a booked maintenance window
  seeded_weak_rollback:
    heuristic_family: weak_rollback
    severity: blocker
    task_id: t1
    message: no rollback for an irreversible write
